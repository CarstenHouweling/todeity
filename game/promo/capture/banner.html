<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Sized by ?w=&h= ; every length is in units of --u (height / 1080). */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: #071a0d; }
  body { font-family: system-ui, -apple-system, sans-serif; position: relative; }
  .panels { position: absolute; inset: 0 0 0 var(--split); }
  .panel { position: absolute; top: 0; bottom: 0; overflow: hidden; }
  .panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: var(--fx) var(--fy); transform: scale(var(--z)); }
  .panel::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.0) 50%, rgba(0,0,0,.55) 100%); }
  .panel .tag { position: absolute; z-index: 2; top: calc(30 * var(--u)); transform: translateX(-50%); white-space: nowrap; font-size: calc(26 * var(--u)); font-weight: 900; letter-spacing: calc(3 * var(--u));
    color: #fff; text-transform: uppercase; text-shadow: 0 2px 12px rgba(0,0,0,.8), 0 0 3px rgba(0,0,0,.8); }
  .edge { position: absolute; top: -5%; bottom: -5%; width: calc(7 * var(--u)); background: linear-gradient(#ffe27a, #f4a523); transform: skewX(-12deg); z-index: 3;
    box-shadow: 0 0 calc(20 * var(--u)) rgba(255, 190, 60, .6); }
  .fade { position: absolute; top: 0; bottom: 0; left: calc(var(--split) - 240 * var(--u)); width: calc(480 * var(--u)); z-index: 4;
    background: linear-gradient(90deg, #071a0d 0%, rgba(7,26,13,.8) 45%, rgba(7,26,13,0) 100%); }
  .left { position: absolute; z-index: 5; left: calc(96 * var(--u)); top: calc(70 * var(--u)); width: calc(var(--textw) * var(--u)); color: #fff; }
  h1 { font-size: calc(158 * var(--u)); line-height: .9; font-weight: 900; color: #e9ffd9; letter-spacing: calc(-2 * var(--u));
    text-shadow: 0 calc(8 * var(--u)) 0 rgba(0,0,0,.35), 0 0 calc(60 * var(--u)) rgba(120,255,140,.25); }
  .sub { margin-top: calc(14 * var(--u)); font-size: calc(36 * var(--u)); font-weight: 800; letter-spacing: calc(4.5 * var(--u)); color: #ffe27a; text-transform: uppercase;
    text-shadow: 0 0 calc(18 * var(--u)) rgba(255,180,40,.6); white-space: nowrap; }
  .line { margin-top: calc(50 * var(--u)); font-size: calc(46 * var(--u)); font-weight: 800; line-height: 1.15; }
  ul { margin-top: calc(34 * var(--u)); padding: 0; list-style: none; font-size: calc(29 * var(--u)); font-weight: 500; line-height: 1.75; color: #f2ffe9; }
  li::before { content: ''; display: inline-block; width: calc(18 * var(--u)); height: calc(18 * var(--u)); border-radius: 50%; background: #ffd34d;
    margin-right: calc(22 * var(--u)); vertical-align: middle; box-shadow: 0 0 calc(10 * var(--u)) rgba(255,200,60,.6); }
  .cta { position: absolute; z-index: 5; left: calc(96 * var(--u)); bottom: calc(150 * var(--u)); padding: calc(22 * var(--u)) calc(40 * var(--u)); border-radius: 999px;
    background: linear-gradient(180deg, #ffd76a, #f4a523); color: #3a2300; font-size: calc(30 * var(--u)); font-weight: 900; letter-spacing: calc(1.5 * var(--u));
    text-transform: uppercase; box-shadow: 0 calc(10 * var(--u)) calc(40 * var(--u)) rgba(255,170,40,.4); white-space: nowrap; }
  .url { position: absolute; z-index: 5; left: calc(100 * var(--u)); bottom: calc(72 * var(--u)); font-size: calc(36 * var(--u)); font-weight: 800; color: #fff; }
  .frogs { position: absolute; z-index: 6; right: calc(40 * var(--u)); bottom: calc(26 * var(--u)); width: var(--frogw);
    filter: drop-shadow(0 calc(12 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.6)); }
  .frogs-label { position: absolute; z-index: 6; right: calc(44 * var(--u)); bottom: calc(var(--frogh) + 36 * var(--u)); font-size: calc(26 * var(--u)); font-weight: 900;
    letter-spacing: calc(3 * var(--u)); color: #ffe27a; text-transform: uppercase; text-shadow: 0 2px 12px rgba(0,0,0,.9); }
  .ground { position: absolute; z-index: 5; right: 0; bottom: 0; height: calc(240 * var(--u)); left: var(--split);
    background: linear-gradient(180deg, rgba(7,26,13,0), rgba(7,26,13,.85)); }
  /* Header: logo and line only. */
  body.header ul, body.header .cta, body.header .frogs-label { display: none; }
  body.header .left { top: calc(110 * var(--u)); }
  body.header h1 { font-size: calc(250 * var(--u)); }
  body.header .sub { font-size: calc(60 * var(--u)); }
  body.header .line { margin-top: calc(70 * var(--u)); font-size: calc(64 * var(--u)); }
  body.header .left { width: auto; }
  body.header .url { bottom: calc(150 * var(--u)); font-size: calc(54 * var(--u)); left: auto; right: calc(60 * var(--u)); text-shadow: 0 2px 16px rgba(0,0,0,.9); }
  body.header .tag { display: none; }
</style>
</head>
<body>
<div class="panels" id="panels"></div>
<div class="fade"></div>
<div class="ground"></div>
<div class="left">
  <h1>TODEITY</h1>
  <div class="sub">Rise of the Tea God</div>
  <div class="line">A frog. A cup of tea.<br>A thousand bees.</div>
  <ul>
    <li>3D roguelite bullet hell</li>
    <li>Ascend from frog to God of Tea</li>
    <li>Seven frogs · skills that fuse</li>
    <li>Raid bosses · five arenas</li>
    <li>Solo or co-op for up to 4</li>
  </ul>
</div>
<div class="cta">▶ Play free in your browser</div>
<div class="url">todeity.azurewebsites.net</div>
<div class="frogs-label">Pick your frog</div>
<img class="frogs">
<script>
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 1920, H = +q.get('h') || 1080, mode = q.get('mode') || 'full';
  const u = H / 1080;
  const base = q.get('dir') ? 'file://' + q.get('dir') + '/' : '';
  document.querySelector('.frogs').src = base + 'lineup.png';
  const r = document.documentElement.style;
  const header = mode === 'header';
  if (header) document.body.classList.add('header');
  // The text column is a fixed width in u; the panels start after it.
  const textw = 680;
  const split = header ? Math.round(W * 0.5) : Math.round((textw + 120) * u);
  r.setProperty('--w', W + 'px'); r.setProperty('--h', H + 'px'); r.setProperty('--u', u + 'px');
  r.setProperty('--split', split + 'px'); r.setProperty('--textw', textw);
  const frogw = Math.min(W - split - 40 * u, 1180 * u);
  r.setProperty('--frogw', frogw + 'px'); r.setProperty('--frogh', (frogw * 283 / 2278) + 'px');
  if (header) document.querySelector('.frogs').style.display = 'none';
  const panels = header
    ? [['ascend.jpg', '50% 40%', '', 1.7], ['summon.jpg', '32% 45%', '', 1.15], ['bullets.jpg', '45% 55%', '', 1.15]]
    : [['ascend.jpg', '50% 40%', 'Ascend', 1.7], ['summon.jpg', '32% 45%', 'Summon', 1.15], ['bullets.jpg', '45% 55%', 'Bullet hell', 1.15]];
  const pw = (W - split) / panels.length;
  const slant = Math.tan(12 * Math.PI / 180) * H; // horizontal run of a -12° skew over the full height
  const host = document.getElementById('panels');
  panels.forEach(([src, pos, tag, zoom], i) => {
    const p = document.createElement('div');
    p.className = 'panel';
    const x0 = i * pw, x1 = (i + 1) * pw;
    const pre = i ? slant / 2 : 240 * u;
    p.style.left = (x0 - pre) + 'px';
    p.style.width = (x1 - x0 + pre + (i < panels.length - 1 ? slant / 2 : 0)) + 'px';
    // Slanted sides (except the outer ends).
    const L = i ? slant : 0, w = parseFloat(p.style.width), R = i < panels.length - 1 ? slant : 0;
    p.style.clipPath = `polygon(${L}px 0, ${w}px 0, ${w - R}px 100%, 0 100%)`;
    const [fx, fy] = pos.split(' ');
    p.innerHTML = `<img src="${base}${src}" style="object-position:${pos};--fx:${fx};--fy:${fy};--z:${zoom}"><div class="tag" style="left:${(L + w) / 2 + (i ? 0 : 60 * u)}px">${tag}</div>`;
    host.append(p);
    if (i) {
      const e = document.createElement('div');
      e.className = 'edge';
      e.style.left = (x0 - 3.5 * u) + 'px';
      host.append(e);
    }
  });
</script>
</body>
</html>
